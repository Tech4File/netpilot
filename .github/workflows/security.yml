name: Security

# Continuous security posture: secret leak detection on every push/PR,
# dependency review on PRs, weekly scheduled deep scan.
#
# NOTE: we deliberately run the gitleaks CLI binary directly (MIT-licensed)
# instead of gitleaks/gitleaks-action, which requires a license key for
# organization repositories. Same engine, no license gate.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC

permissions:
  contents: read

env:
  GITLEAKS_VERSION: v8.30.1

jobs:
  secrets:
    name: Secret leak scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }} (pinned, checksum-verified)
        run: |
          VERSION="${GITLEAKS_VERSION#v}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${VERSION}_checksums.txt" -o /tmp/checksums.txt
          EXPECTED=$(grep "gitleaks_${VERSION}_linux_x64.tar.gz" /tmp/checksums.txt | awk '{print $1}')
          echo "$EXPECTED  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history for committed secrets
        run: gitleaks detect --source . --redact --verbose --no-banner

  dependencies:
    name: Dependency review (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Review dependencies for known vulnerabilities & license issues
        uses: actions/dependency-review-action@v5
        # Advisory on repos where the dependency graph is unavailable
        # (private repos without that setting enabled). Re-enable as a
        # hard gate once Settings -> Code security -> Dependency graph is on.
        continue-on-error: true
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  hardening:
    name: Build-hardening checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fail if cleartext traffic is ever re-enabled
        run: |
          ! grep -rn "cleartextTrafficPermitted=\"true\"" app/src
      - name: Fail if debuggable sneaks into release config
        run: |
          ! grep -rn "android:debuggable=\"true\"" app/src/main
      - name: Fail if backup rules start leaking profile storage
        run: |
          grep -q "netpilot_profiles.xml" app/src/main/res/xml/backup_rules.xml
          grep -q "netpilot_profiles.xml" app/src/main/res/xml/data_extraction_rules.xml
