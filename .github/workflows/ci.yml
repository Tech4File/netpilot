name: CI

# NetPilot continuous integration.
# Order of defence: static analysis + unit tests → lint → APK build →
# instrumented tests on real Android emulators (API 29 & 34, incl. a
# permission-granted leg that exercises real system writes).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Unit tests · Lint · Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Unit tests (JUnit + Robolectric)
        run: ./gradlew --stacktrace :app:testDebugUnitTest

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK (find/fix bugs BEFORE packaging)
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netpilot-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test & lint reports (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  instrumentation:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            grant-secure-settings: false # Android 9/10 leg — degraded (ungranted) UX path
          - api-level: 34
            grant-secure-settings: true # Android 14 leg — real system-write path
          - api-level: 35
            grant-secure-settings: true # Android 15 leg — targetSdk edge (edge-to-edge, FGS types)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          script: |
            if [ "${{ matrix.grant-secure-settings }}" = "true" ]; then
              adb shell pm grant app.netpilot android.permission.WRITE_SECURE_SETTINGS
            fi
            ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: app/build/outputs/androidTest-results/

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL (Java/Kotlin, security-extended)
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
