name: CI

# NetPilot continuous integration.
# Order of defence: static analysis + unit tests → lint → APK build →
# instrumented tests on real Android emulators (API 28, 29, 34 & 35, incl.
# permission-granted legs that exercise real system writes).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Unit tests · Lint · Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Belt & braces: some platforms (Windows checkouts, zips) drop the +x bit.
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Unit tests (JUnit + Robolectric)
        run: ./gradlew --stacktrace :app:testDebugUnitTest

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK (find/fix bugs BEFORE packaging)
        run: ./gradlew :app:assembleDebug

      # Compile the instrumented-test APK too — catches androidTest compile
      # errors here (2 min, no emulator) instead of after an emulator boots.
      - name: Assemble androidTest APK (compile instrumentation early)
        run: ./gradlew :app:assembleDebugAndroidTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netpilot-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test & lint reports (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  instrumentation:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 28
            grant-secure-settings: false # Android 9 leg — minSdk floor, everything must at least run
          - api-level: 29
            grant-secure-settings: false # Android 9/10 leg — degraded (ungranted) UX path
          - api-level: 34
            grant-secure-settings: true # Android 14 leg — real system-write path
          - api-level: 35
            grant-secure-settings: true # Android 15 leg — targetSdk edge (edge-to-edge, FGS types)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure gradlew & CI scripts are executable
        run: |
          chmod +x gradlew
          chmod +x .github/scripts/*.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # NOTE: keep the `script` a single line — multiline inline scripts were
      # truncated by the action (see .github/scripts/run-instrumented-tests.sh).
      # Emulator options are intentionally left at the action defaults
      # (-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim);
      # overriding them would drop the headless GPU backend.
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          script: bash .github/scripts/run-instrumented-tests.sh
        env:
          GRANT_SECURE_SETTINGS: ${{ matrix.grant-secure-settings }}

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: app/build/outputs/androidTest-results/

      - name: Upload failure diagnostics (logcat + adb state)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-diagnostics-api-${{ matrix.api-level }}
          path: failed-diagnostics.txt
          if-no-files-found: ignore

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Java/Kotlin requires a compiled code database: use manual build mode
      # ('none' is not supported for JVM languages) and compile explicitly.
      - name: Initialize CodeQL (Java/Kotlin, security-extended)
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build for CodeQL
        run: ./gradlew :app:compileDebugJavaWithJavac :app:compileDebugKotlin --no-daemon --console=plain

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
