name: CI

# NetPilot CI — build & test ONLY.
# This workflow: unit tests → lint → APK builds → instrumented emulator legs.
# All SCANS (CodeQL, secret scan, dependency review, hardening) live in the
# Security workflow; publishing lives in the Release workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Unit tests · Lint · Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Belt & braces: some platforms (Windows checkouts, zips) drop the +x bit.
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # The repo gradle.properties is tuned for 2 GB sandboxes; CI runners
      # have headroom, and one persistent daemon serves all the steps below
      # (unit tests, lint, two assembles) — give it real memory so the
      # fourth invocation cannot exhaust the heap (v2.2.1 fix).
      - name: Configure Gradle memory for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx1500m" >> gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Unit tests (JUnit + Robolectric)
        run: ./gradlew --stacktrace :app:testDebugUnitTest

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK (find/fix bugs BEFORE packaging)
        run: ./gradlew :app:assembleDebug

      # Compile the instrumented-test APK too — catches androidTest compile
      # errors here (2 min, no emulator) instead of after an emulator boots.
      - name: Assemble androidTest APK (compile instrumentation early)
        run: ./gradlew :app:assembleDebugAndroidTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netpilot-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test & lint reports (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  instrumentation:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 28
            grant-secure-settings: false # Android 9 leg — minSdk floor, everything must at least run
          - api-level: 29
            grant-secure-settings: false # Android 9/10 leg — degraded (ungranted) UX path
          - api-level: 34
            grant-secure-settings: true # Android 14 leg — real system-write path
          - api-level: 35
            grant-secure-settings: true # Android 15 leg — targetSdk edge (edge-to-edge, FGS types)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Gradle memory for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx1500m" >> gradle.properties

      - name: Ensure gradlew & CI scripts are executable
        run: |
          chmod +x gradlew
          chmod +x .github/scripts/*.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # NOTE: keep the `script` a single line — multiline inline scripts were
      # truncated by the action (see .github/scripts/run-instrumented-tests.sh).
      # Emulator options are intentionally left at the action defaults
      # (-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim);
      # overriding them would drop the headless GPU backend.
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          script: bash .github/scripts/run-instrumented-tests.sh
        env:
          GRANT_SECURE_SETTINGS: ${{ matrix.grant-secure-settings }}

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: app/build/outputs/androidTest-results/

      - name: Upload failure diagnostics (logcat + adb state)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-diagnostics-api-${{ matrix.api-level }}
          path: failed-diagnostics.txt
          if-no-files-found: ignore
