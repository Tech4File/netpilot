name: OpenVPN native engine build

# Builds libovpncore.so — the embedded OpenVPN engine (openvpn3 core +
# NetPilot JNI) — for all four ABIs and uploads it as an artifact.
#
# - workflow_dispatch: build on demand (device-testing builds, iteration).
# - repository_dispatch from Release: the Release workflow calls this to
#   package the engine into the published APKs (binaries are never
#   committed — standing rule).
#
# Recipe proven by the v2.2.1 probe (its two failures are fixed here):
#   - asio found via explicit ASIO_INCLUDE_DIR (Findasio.cmake wants asio.hpp)
#   - OpenSSL is the crypto flavor (the official Android client's default);
#     the mbedtls 3.6.5 path died on its TF-PSA-Crypto submodule
#   - lz4 + fmt cross-built static into a per-ABI prefix

on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'ABIs to build (space separated)'
        default: 'arm64-v8a armeabi-v7a x86 x86_64'

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync ninja-build file

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build the engine (all ABIs)
        run: |
          chmod +x scripts/build-ovpn-native.sh scripts/vendor-openvpn-core.sh
          scripts/build-ovpn-native.sh ${{ github.event.inputs.abis || 'arm64-v8a armeabi-v7a x86 x86_64' }}

      - name: Verify artifacts
        run: |
          find openvpn-core/src/main/jniLibs -name "*.so" -exec file {} \;
          test -f openvpn-core/src/main/jniLibs/arm64-v8a/libovpncore.so

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: ovpn-engine-libs
          path: openvpn-core/src/main/jniLibs/
          if-no-files-found: error
