name: Release

# Tag-driven release: full verification, signed APK/AAB, checksums, changelog.
#
# Required repository secrets for signed releases:
#   ANDROID_KEYSTORE_B64      base64 of your PKCS12 keystore
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Without secrets the workflow still produces an UNSIGNED artifact but refuses
# to publish a GitHub Release (fail-safe, see docs/RELEASE.md).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: All tests must pass before any release build
        run: ./gradlew --stacktrace :app:testDebugUnitTest :app:lintDebug

  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Detect signing configuration
        id: signing
        run: |
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/.ci-release-keystore.jks"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing — building UNSIGNED artifact and skipping publish. See docs/RELEASE.md"
          fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed release APK + AAB
        if: steps.signing.outputs.signed == 'true'
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Build unsigned release APK (testing artifact only)
        if: steps.signing.outputs.signed != 'true'
        run: |
          ./gradlew :app:assembleRelease

      - name: Generate checksums
        run: |
          cd app/build/outputs
          find apk -name "*.apk" -exec sha256sum {} \; | tee checksums-sha256.txt
          find bundle -name "*.aab" -exec sha256sum {} \; >> checksums-sha256.txt || true

      - name: Generate changelog from commits
        if: steps.signing.outputs.signed == 'true'
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          git log --pretty="format:- %s (%h)" "${PREV}..${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## NetPilot ${{ github.ref_name }}

            Signed release build. Verify with the SHA-256 checksums below.

            ### Changes
            ${{ steps.changelog.outputs.changes }}

            ### Install
            Sideload the APK, then run the one-time ADB grant:
            ```
            adb shell pm grant app.netpilot android.permission.WRITE_SECURE_SETTINGS
            ```
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/checksums-sha256.txt

      - name: Upload unsigned artifact (no publish)
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: netpilot-unsigned-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/checksums-sha256.txt
