name: Release

# Fully automated releases — three ways, all hands-off:
#
# 1. AUTO (default): every push to main publishes a Release for the version
#    already set in app/build.gradle.kts (versionName). If that version was
#    released before, the run exits gracefully (nothing duplicate).
# 2. MANUAL bump: Actions -> Release -> Run workflow -> pick patch/minor/major.
#    If versionName in source is already newer than the latest release tag,
#    it is released as-is (the developer's bump wins; never downgraded).
#    Otherwise the workflow bumps the version in source, commits and tags it.
# 3. TAG push: pushing vX.Y.Z releases exactly that version.
#
# Produces, attached to the GitHub Release:
#   NetPilot-vX.Y.Z.apk           universal, works on every device (RECOMMENDED)
#   NetPilot-vX.Y.Z-<abi>.apk     per-ABI variants (content-identical: zero native code)
#   NetPilot-vX.Y.Z.apks          split set - auto-detects the device on install
#                                 (bundletool/SAI; density+CPU splits, signed)
#   NetPilot-vX.Y.Z.apk.zip       fallback: all APKs + INSTALL-GUIDE.txt in one zip
#   NetPilot-vX.Y.Z.aab           Play-Store bundle
#   checksums-sha256.txt          SHA-256 of every staged file
#   NetPilot-vX.Y.Z-source.zip    reproducible source archive
# Signed when the 4 ANDROID_KEYSTORE_* secrets exist (see "Signing setup
# (one-time)"); otherwise clearly labelled -unsigned.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Rule applied to the latest release tag (versions shown are EXAMPLES - the real next version is computed at run time)"
        required: true
        default: "auto-patch"
        type: choice
        options:
          - "auto-patch (bug fixes): latest release +0.0.1"
          - "auto-minor (new features): latest release +0.1.0"
          - "auto-major (breaking changes): latest release +1.0.0"
          - "manual: exact version in the field below"
      version:
        description: "Exact version (ONLY used when bump=manual), e.g. 2.0.1"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write # secret-name diagnostics only (never values)

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: All tests must pass before any release build
        run: ./gradlew --stacktrace :app:testDebugUnitTest :app:lintDebug

  instrumented-gate:
    name: Instrumented gate (API 29, ungranted)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb_hid_key
          key: avd-29-api
      - name: Run instrumented tests on one representative emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: ./.github/scripts/run-instrumented-tests.sh
        env:
          GRANT_SECURE_SETTINGS: "false"

  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    needs: [verify, instrumented-gate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: ver
        run: |
          set -e
          MODE="${{ github.event_name }}"
          DETAIL=""
          if [ "${{ github.event_name }}" = "push" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            NEXT="${GITHUB_REF_NAME#v}"
            MODE="tag"
            DETAIL="tag push"
          elif [ "${{ github.event_name }}" = "push" ]; then
            NEXT=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts)
            MODE="auto"
            DETAIL="push to main (versionName in source)"
          else
            git fetch --tags --quiet origin || true
            LAST=$(git tag --list 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
            if [ -z "$LAST" ]; then
              LAST=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts)
            fi
            MAJOR=${LAST%%.*}; REST=${LAST#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
            case "${{ inputs.bump }}" in
              auto-patch) CAND="$MAJOR.$MINOR.$((PATCH+1))" ;;
              auto-minor) CAND="$MAJOR.$((MINOR+1)).0" ;;
              auto-major) CAND="$((MAJOR+1)).0.0" ;;
              manual)     CAND="${{ inputs.version }}" ;;
              *) echo "::error::Unknown bump type"; exit 1 ;;
            esac
            MODE="manual"
            SRC=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts)
            if [ "$SRC" != "$LAST" ] && [ "$(printf '%s\n%s\n' "$LAST" "$SRC" | sort -V | head -1)" = "$LAST" ]; then
              NEXT="$SRC"
              DETAIL="manual dispatch - source versionName (v$SRC) already ahead of latest release (v$LAST); released as-is"
            else
              NEXT="$CAND"
              DETAIL="manual dispatch (previous release: v$LAST; rule gave v$CAND)"
            fi
            if ! [ "$(printf '%s\n%s\n' "$LAST" "$NEXT" | sort -V | head -1)" = "$LAST" ] || [ "$NEXT" = "$LAST" ]; then
              echo "::error::Requested version '$NEXT' is not newer than the latest release 'v$LAST' — refusing."
              exit 1
            fi
          fi
          if ! [[ "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be SemVer like 1.2.0 (got '$NEXT')"; exit 1
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Releasing v$NEXT ($DETAIL)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Skip gracefully if this version was already released
        id: dup
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG already exists — nothing to release (bump versionName in app/build.gradle.kts to release again)."
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version in source, commit and tag (manual mode only)
        if: steps.dup.outputs.already_released == 'false' && steps.ver.outputs.mode == 'manual'
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          VNAME=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts)
          if [ "$VNAME" != "$VERSION" ]; then
            VCODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
            sed -i "s/versionCode = [0-9]\+/versionCode = $((VCODE+1))/; s/versionName = \"[0-9.]*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
            git config user.name  "netpilot-release-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -am "chore(release): v$VERSION [skip ci]"
            BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
            git push origin "HEAD:refs/heads/$BRANCH"
            echo "bumped $VNAME -> $VERSION (versionCode $((VCODE+1)))"
          else
            echo "versionName already $VERSION — no bump needed"
          fi
          git tag "$TAG" HEAD
          git push origin "$TAG"

      - name: Tag this release (auto/tag modes)
        if: steps.dup.outputs.already_released == 'false' && steps.ver.outputs.mode != 'manual'
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name  "netpilot-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git tag "$TAG" HEAD
          git push origin "$TAG"
          echo "tag $TAG created on the released commit"

      - name: Detect signing configuration
        id: signing
        if: steps.dup.outputs.already_released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/.ci-release-keystore.jks"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets not visible to this run — the release will be published UNSIGNED (labelled as such)."
            echo "Secret names visible to this repo right now:"
            gh secret list -R "$GITHUB_REPOSITORY" 2>/dev/null | sed 's/^/  /' || echo "  (could not list)"
            echo "Expected exactly: ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            echo "If some appear here but detection missed them, check they are REPOSITORY secrets (not environment/organization) with those exact names."
          fi

      - name: Build release APKs + AAB
        if: steps.dup.outputs.already_released == 'false'
        env:
          # The signing config lives in app/build.gradle.kts and reads these
          # env vars AT BUILD TIME — they must be exported to THIS step too,
          # not only to the detection step above.
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -PabiSplits   # universal + per-ABI APKs
          ./gradlew :app:bundleRelease                 # Play bundle (splits off)

      - name: Stage release files with product names
        if: steps.dup.outputs.already_released == 'false'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1 | grep -c unsigned || true)
          SUFFIX=""
          if [ "$UNSIGNED" = "1" ]; then SUFFIX="-unsigned"; fi
          mkdir -p release-staging
          # Headline: the UNIVERSAL apk — recommended download, every device.
          cp app/build/outputs/apk/release/app-universal-release*.apk "release-staging/NetPilot-v${VERSION}${SUFFIX}.apk"
          # Per-ABI variants (for .apk.zip: manual CPU-matched installs).
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            SRC=$(ls app/build/outputs/apk/release/app-${ABI}-release*.apk 2>/dev/null | head -1)
            [ -n "$SRC" ] && cp "$SRC" "release-staging/NetPilot-v${VERSION}-${ABI}${SUFFIX}.apk"
          done
          AAB=$(ls app/build/outputs/bundle/release/*.aab 2>/dev/null | head -1)
          [ -n "$AAB" ] && cp "$AAB" "release-staging/NetPilot-v${VERSION}.aab"

          # .apks: bundletool split set — the single installer that detects the
          # connected device and installs only matching density/CPU pieces.
          # Signed with the release key when signing is active.
          curl -sL -o /tmp/bundletool.jar "https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar"
          if [ -f "$GITHUB_WORKSPACE/.ci-release-keystore.jks" ]; then
            java -jar /tmp/bundletool.jar build-apks \
              --bundle="release-staging/NetPilot-v${VERSION}.aab" \
              --output="release-staging/NetPilot-v${VERSION}.apks" --overwrite \
              --ks="$GITHUB_WORKSPACE/.ci-release-keystore.jks" \
              --ks-key-alias="${ANDROID_KEY_ALIAS}" \
              --ks-pass="pass:${ANDROID_KEYSTORE_PASSWORD}" \
              --key-pass="pass:${ANDROID_KEY_PASSWORD}"
            echo ".apks generated (SIGNED with the release key)"
          else
            java -jar /tmp/bundletool.jar build-apks \
              --bundle="release-staging/NetPilot-v${VERSION}.aab" \
              --output="release-staging/NetPilot-v${VERSION}.apks" --overwrite
            echo "::warning::.apks generated UNSIGNED (no signing secrets) — install via bundletool requires a signed set."
          fi

          cat > release-staging/INSTALL-GUIDE.txt <<'GUIDE'
          NetPilot - which download do I use?
          ===================================
          MOST PEOPLE:  NetPilot-v*.apk  (universal)
            Installs directly on any Android 9+ device: Android TV /
            Google TV, phones, tablets - every CPU, every screen density.

          ADVANCED:  NetPilot-v*.apks  (split set - device auto-detect)
            A single file containing density/CPU split APKs. On install it
            detects the connected device and pushes only the matching
            pieces. Requires adb + bundletool:
              bundletool install-apks --apks NetPilot-v*.apks
            or an on-device split installer app (e.g. SAI). Generated from
            the same signed build as the release.

          FALLBACK:  NetPilot-v*.apk.zip  (universal + per-CPU APKs)
            If .apks does not work in your setup: unzip and install the
            APK that matches your device (the universal one works on
            everything; per-ABI files are named by CPU).

          PLAY STORE:  NetPilot-v*.aab
            For uploading to Google Play (Play does per-device delivery
            automatically).

          VERIFY:  checksums-sha256.txt lists the SHA-256 of every file.

          First launch (TV/phone) needs the one-time permission:
            adb shell pm grant app.netpilot android.permission.WRITE_SECURE_SETTINGS
          Updates: install any NEWER NetPilot version straight over the
          old one (profiles and settings are kept).
          GUIDE
          sed -i 's/^          //' release-staging/INSTALL-GUIDE.txt
          (cd release-staging && zip -q "NetPilot-v${VERSION}.apk.zip" *.apk INSTALL-GUIDE.txt)
          echo "staged (suffix: '${SUFFIX}'):"
          ls -la release-staging/

      - name: Package source zip
        if: steps.dup.outputs.already_released == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git archive --format=zip -o "release-staging/NetPilot-v${VERSION}-source.zip" HEAD
          echo "source zip staged"

      - name: Generate checksums (final staged files)
        if: steps.dup.outputs.already_released == 'false'
        run: |
          cd release-staging
          sha256sum NetPilot-v*.apk NetPilot-v*.aab NetPilot-v*.apks NetPilot-v*.apk.zip NetPilot-v*-source.zip > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Publish GitHub Release
        if: steps.dup.outputs.already_released == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: NetPilot v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            ## NetPilot v${{ steps.ver.outputs.version }}

            ${{ steps.signing.outputs.signed == 'true' && '✅ **Signed release build.**' || '⚠️ **UNSIGNED build** (no signing secrets configured) — fine for sideloading/testing; run the "Signing setup (one-time)" workflow to enable signing.' }} Verify downloads with the SHA-256 checksums attached.

            ### Which download?
            | File | Use it when |
            |---|---|
            | `NetPilot-v*.apk` | **Most people** — universal, installs directly anywhere |
            | `NetPilot-v*.apks` | You use bundletool/SAI — one file that auto-detects your device and installs only the matching density & CPU pieces |
            | `NetPilot-v*.apk.zip` | `.apks` not supported on your device/tooling — unzip and install the APK for your device (universal = any device) |
            | `NetPilot-v*.aab` | Uploading to Google Play |

            ### Runs everywhere — one universal APK
            | Device type | Covered |
            |---|---|
            | Android TV / Google TV (D-pad, banner, leanback launcher) | ✅ |
            | Phones & tablets (responsive layouts, Light/Dark) | ✅ |
            | CPU: arm64-v8a, armeabi-v7a, x86, x86_64 | ✅ all inside one APK |
            | All screen densities (mdpi → xxxhdpi + adaptive icons) | ✅ |
            | Density-split delivery via `.apks` (7 density splits, device-matched) | ✅ |

            NetPilot contains **zero native code**, so the universal APK runs on
            every architecture and every Android 9+ device — nothing to pick or
            match. `NetPilot-v*.apk.zip` bundles the universal + per-ABI
            variants with an install guide (they are content-identical).
            `NetPilot-v*.aab` is the Play-Store bundle; Play generates optimized
            per-device downloads from it automatically.

            ### Install on Android TV / phone
            1. Sideload the release APK (`adb install …` or install from Files).
            2. Grant the one-time permission (no root needed):
            ```
            adb shell pm grant app.netpilot android.permission.WRITE_SECURE_SETTINGS
            ```
            3. Open NetPilot → PRIVATE DNS → add a provider hostname → activate.

            ### Updating
            Installs directly **over any previous signed NetPilot release** — your
            profiles and settings are kept (versionCode always increases).
            Coming from an **unsigned/debug** build? Android will refuse the
            update ("App not installed"): uninstall the old one first, install
            this, then re-run the ADB grant command above (uninstalling clears
            that permission; updates do not).

            Built automatically by the Release workflow from verified source (all tests green).
          files: |
            release-staging/NetPilot-v*.apk
            release-staging/NetPilot-v*.aab
            release-staging/NetPilot-v*.apks
            release-staging/NetPilot-v*.apk.zip
            release-staging/checksums-sha256.txt
            release-staging/NetPilot-v*-source.zip

      - name: Upload unsigned artifact (workflow copy)
        if: steps.dup.outputs.already_released == 'false' && steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: netpilot-unsigned-release
          path: release-staging/
