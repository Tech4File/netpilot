version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
    ignore:
      # These only become possible together (one coordinated upgrade):
      # AGP 9.x needs Gradle 9.x; core-ktx >= 1.18 additionally needs
      # AGP >= 9.1 and compileSdk >= 37. AGP 8.10+ needs Gradle newer than
      # 8.11.1; Kotlin >= 2.1 was never validated with our toolchain (its
      # PR failed CI). Remove/extend these ignores when doing the combined
      # AGP + Gradle + compileSdk upgrade, verified locally first.
      - dependency-name: "com.android.application"
        versions: [">=8.10.0"]
      - dependency-name: "org.gradle"
        versions: [">=9.0.0"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.18.0"]
      - dependency-name: "org.jetbrains.kotlin.android"
        versions: [">=2.1.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
