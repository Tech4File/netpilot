# NetPilot Gradle configuration — tuned for constrained CI runners and low-memory machines.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx700m
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.7.x predates API 36; the combo is fine — silence the "untested" nag
android.suppressUnsupportedCompileSdk=36

# Single-JVM build: compile Kotlin inside the Gradle JVM (2GB-RAM sandbox
# and small CI runners; avoids a second Kotlin daemon).
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
