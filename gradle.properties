# NetPilot Gradle configuration — tuned for constrained CI runners and low-memory machines.
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx700m
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.7.x predates API 36; the combo is fine — silence the "untested" nag
android.suppressUnsupportedCompileSdk=36
